services:
  server:
    build:
      context: .
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: scuola
      DB_USER: studente
      DB_PASSWORD: esempio_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: esempio_root_password
      MYSQL_DATABASE: scuola
      MYSQL_USER: studente
      MYSQL_PASSWORD: esempio_password
    volumes:
      - dati_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Interfaccia web per amministrare MySQL.
  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "127.0.0.1:8083:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  dati_mysql:
